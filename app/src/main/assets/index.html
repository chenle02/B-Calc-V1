<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B-Calc V1.1</title><style>body{margin:0;background:#07131e;color:white;font-family:system-ui}.app{padding:14px;padding-bottom:85px}button{border:0;border-radius:14px;background:#29445a;color:white;font-weight:900;padding:15px;margin:4px;font-size:18px}.box{background:#132838;border-radius:20px;padding:12px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.screen{width:100%;box-sizing:border-box;font-size:34px;text-align:right;padding:12px;border-radius:14px;background:#07131e;color:white;border:1px solid #36566a}.green{background:#14a46d}.red{background:#d64242}.bar{position:fixed;left:10px;right:10px;bottom:10px;display:flex;overflow:auto}</style></head><body><div class="app"><h1>🧮 B-Calc V1.1</h1><div class="box"><input id="screen" class="screen" readonly value="0"><div id="keys" class="grid"></div></div><div class="box"><b>History</b><div id="history"></div></div><div class="bar"><button onclick="openLauncher()">B-Launcher</button><button onclick="openTasks()">B-Tasks</button><button onclick="clearHistory()">Clear</button></div></div><script src="app.js"></script></body></html>
