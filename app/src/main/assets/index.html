<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B-Calc V1</title><style>body{margin:0;background:#07131e;color:white;font-family:system-ui}.app{min-height:100vh;padding:14px;padding-bottom:90px;background:radial-gradient(circle at top,#174569,#07131e 45%,#04070c)}h1{margin:0}.sub,.meta{color:#a8c7d9;font-size:13px}.top{display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px;border-radius:16px;background:linear-gradient(135deg,#0b84ff,#50ff9d);display:grid;place-items:center}.box{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:12px;margin:12px 0}input,select{width:100%;box-sizing:border-box;padding:12px;margin:5px 0;border-radius:14px;border:1px solid #36566a;background:#132838;color:white;font-size:16px}.display{font-size:34px;font-weight:900;text-align:right;min-height:50px;word-break:break-all}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.btn{border:0;border-radius:18px;background:#29445a;color:white;font-weight:900;font-size:18px;padding:16px 8px}.blue{background:#0b84ff}.green{background:#14a46d}.red{background:#d64242}.tab{border:0;border-radius:999px;background:#29445a;color:white;font-weight:900;padding:10px 12px}.on{background:#0b84ff}.result{font-size:22px;font-weight:900}.bar{position:fixed;left:10px;right:10px;bottom:10px;display:flex;gap:6px;overflow:auto}.bar button{white-space:nowrap;border:0;border-radius:999px;background:#29445a;color:white;font-weight:900;padding:11px 13px}.card{background:rgba(255,255,255,.08);border-radius:16px;padding:10px;margin:8px 0}</style></head><body><div class="app"><div class="top"><div class="logo">🧮</div><div><h1>B-Calc V1</h1><div class="sub">Calculator + converter tools</div></div></div><div class="box"><button id="calcTab" class="tab on" onclick="mode='calc';draw()">Calc</button><button id="unitTab" class="tab" onclick="mode='unit';draw()">Units</button><button id="percentTab" class="tab" onclick="mode='percent';draw()">Percent</button><button id="batteryTab" class="tab" onclick="mode='battery';draw()">Battery</button></div><div id="main"></div><div class="box"><b>History</b><div id="history"></div></div><div class="bar"><button onclick="openLauncher()">B-Launcher</button><button onclick="openTasks()">B-Tasks</button><button onclick="openNotes()">B-Notes</button><button onclick="clearHistory()">Clear</button></div></div><script>let mode='calc',expr='',hist=[];try{hist=JSON.parse(localStorage.getItem('bcalc_history')||'[]')}catch(e){}function save(){localStorage.setItem('bcalc_history',JSON.stringify(hist))}function tabs(){calcTab.classList.toggle('on',mode==='calc');unitTab.classList.toggle('on',mode==='unit');percentTab.classList.toggle('on',mode==='percent');batteryTab.classList.toggle('on',mode==='battery')}function addHist(s){hist.unshift(s);hist=hist.slice(0,30);save();renderHist()}function renderHist(){history.innerHTML='';if(!hist.length){history.innerHTML='<div class=meta>No history yet.</div>';return}hist.forEach(x=>{let d=document.createElement('div');d.className='card';d.textContent=x;history.appendChild(d)})}function draw(){tabs();if(mode==='calc')drawCalc();if(mode==='unit')drawUnit();if(mode==='percent')drawPercent();if(mode==='battery')drawBattery();renderHist()}function drawCalc(){main.innerHTML='<div class=box><div id=display class=display>'+esc(expr||'0')+'</div><div class=grid id=keys></div></div>';['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+','C','⌫','(',')'].forEach(k=>{let b=document.createElement('button');b.className='btn '+(k==='='?'green':k==='C'?'red':'');b.textContent=k;b.onclick=()=>press(k);keys.appendChild(b)})}function press(k){if(k==='C')expr='';else if(k==='⌫')expr=expr.slice(0,-1);else if(k==='='){try{let r=Function('return '+expr)();addHist(expr+' = '+r);expr=String(r)}catch(e){expr='Error'}}else expr+=k;drawCalc()}function drawUnit(){main.innerHTML='<div class=box><b>Unit Converter</b><input id=uval type=number placeholder=value><select id=utype><option value=mi_km>Miles → Kilometers</option><option value=km_mi>Kilometers → Miles</option><option value=lb_kg>Pounds → Kilograms</option><option value=kg_lb>Kilograms → Pounds</option><option value=f_c>°F → °C</option><option value=c_f>°C → °F</option><option value=in_cm>Inches → cm</option><option value=cm_in>cm → Inches</option></select><button class="btn blue" onclick=convertUnit()>Convert</button><div id=ures class=result></div></div>'}function convertUnit(){let v=parseFloat(uval.value);if(isNaN(v))return;let t=utype.value,r=0;if(t==='mi_km')r=v*1.60934;if(t==='km_mi')r=v/1.60934;if(t==='lb_kg')r=v*0.453592;if(t==='kg_lb')r=v/0.453592;if(t==='f_c')r=(v-32)*5/9;if(t==='c_f')r=v*9/5+32;if(t==='in_cm')r=v*2.54;if(t==='cm_in')r=v/2.54;ures.textContent=r.toFixed(4);addHist('Unit: '+v+' → '+r.toFixed(4))}function drawPercent(){main.innerHTML='<div class=box><b>Percent Tools</b><input id=p1 type=number placeholder="number"><input id=p2 type=number placeholder="percent"><button class="btn blue" onclick=percentOf()>% of number</button><button class="btn green" onclick=addPercent()>Add %</button><button class="btn red" onclick=subPercent()>Subtract %</button><div id=pres class=result></div></div>'}function percentOf(){let a=+p1.value,b=+p2.value,r=a*b/100;pres.textContent=r;addHist(b+'% of '+a+' = '+r)}function addPercent(){let a=+p1.value,b=+p2.value,r=a*(1+b/100);pres.textContent=r;addHist(a+' + '+b+'% = '+r)}function subPercent(){let a=+p1.value,b=+p2.value,r=a*(1-b/100);pres.textContent=r;addHist(a+' - '+b+'% = '+r)}function drawBattery(){main.innerHTML='<div class=box><b>Battery / Time</b><input id=bat type=number placeholder="battery percent"><input id=mins type=number placeholder="minutes per 1%"><button class="btn blue" onclick=batteryTime()>Estimate</button><div id=bres class=result></div></div>'}function batteryTime(){let b=+bat.value,m=+mins.value,r=b*m;let h=Math.floor(r/60),mm=Math.round(r%60);bres.textContent=h+'h '+mm+'m';addHist(b+'% at '+m+' min/% = '+h+'h '+mm+'m')}function clearHistory(){hist=[];save();renderHist()}function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function openApp(p,c,n){try{AndroidBridge.openApp(p,c,n)}catch(e){}}function openLauncher(){openApp('com.chenboda01.blauncherv1','com.chenboda01.blauncherv1.MainActivity','B-Launcher V1')}function openTasks(){openApp('com.chenboda01.btasksv1','com.chenboda01.btasksv1.MainActivity','B-Tasks V1')}function openNotes(){openApp('com.chenboda01.bnotesv1','com.chenboda01.bnotesv1.MainActivity','B-Notes V1')}window.bcalcBack=function(){expr='';draw()};draw();</script></body></html>
